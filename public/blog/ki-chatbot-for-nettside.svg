<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#15C07C"/>
    </marker>
    <marker id="arwm" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#9FB3A7"/>
    </marker>
  </defs>

  <rect width="800" height="420" rx="16" fill="#0B2118"/>

  <text x="40" y="46" fill="#EFEDE2" font-size="21" font-weight="700">KI-chatbot for nettside</text>
  <text x="40" y="70" fill="#9FB3A7" font-size="13">Fra besøkende til løst sak - tre mulige utfall</text>
  <text x="760" y="46" fill="#15C07C" font-size="13" font-weight="600" text-anchor="end">KI Consult</text>
  <line x1="40" y1="88" x2="760" y2="88" stroke="#1B3A2B" stroke-width="1"/>

  <!-- Step 1: visitor -->
  <rect x="40" y="150" width="150" height="112" rx="12" fill="#122E22" stroke="#1F4534" stroke-width="1"/>
  <circle cx="70" cy="180" r="13" fill="#15C07C" opacity="0.18"/>
  <circle cx="70" cy="177" r="4.5" fill="#3FE0A0"/>
  <path d="M62 189 a8 8 0 0 1 16 0 Z" fill="#3FE0A0"/>
  <text x="94" y="185" fill="#EFEDE2" font-size="13" font-weight="600">Besøkende</text>
  <text x="60" y="215" fill="#9FB3A7" font-size="11">Stiller spørsmål i</text>
  <text x="60" y="231" fill="#9FB3A7" font-size="11">chatten - kl. 21:40,</text>
  <text x="60" y="247" fill="#9FB3A7" font-size="11">på norsk</text>

  <line x1="190" y1="206" x2="234" y2="206" stroke="#15C07C" stroke-width="2" marker-end="url(#arw)"/>

  <!-- Step 2: the bot -->
  <rect x="242" y="132" width="176" height="148" rx="12" fill="#15C07C" opacity="0.12"/>
  <rect x="242" y="132" width="176" height="148" rx="12" fill="none" stroke="#15C07C" stroke-width="1.5"/>
  <rect x="266" y="152" width="128" height="34" rx="8" fill="#15C07C"/>
  <text x="330" y="174" fill="#062018" font-size="13" font-weight="700" text-anchor="middle">KI-chatbot</text>
  <text x="330" y="209" fill="#EFEDE2" font-size="11" text-anchor="middle">Svarer ut fra dine kilder:</text>
  <text x="330" y="228" fill="#9FB3A7" font-size="11" text-anchor="middle">prisliste · åpningstider</text>
  <text x="330" y="245" fill="#9FB3A7" font-size="11" text-anchor="middle">tjenester · FAQ · kalender</text>
  <text x="330" y="266" fill="#3FE0A0" font-size="11" font-weight="600" text-anchor="middle">Svarer på sekunder, 24/7</text>

  <!-- fan-out lines -->
  <path d="M418 206 C 462 206, 462 112, 506 112" fill="none" stroke="#15C07C" stroke-width="2" marker-end="url(#arw)"/>
  <path d="M418 206 L 506 206" fill="none" stroke="#15C07C" stroke-width="2" marker-end="url(#arw)"/>
  <path d="M418 206 C 462 206, 462 300, 506 300" fill="none" stroke="#9FB3A7" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arwm)"/>

  <!-- Outcome 1 -->
  <rect x="514" y="80" width="246" height="64" rx="10" fill="#F3EFE4"/>
  <rect x="514" y="80" width="4" height="64" rx="2" fill="#15A06A"/>
  <text x="534" y="106" fill="#16190F" font-size="13" font-weight="700">1 · Løser saken selv</text>
  <text x="534" y="126" fill="#5A6357" font-size="11">Pris, åpningstid, tjenester - ferdig</text>

  <!-- Outcome 2 -->
  <rect x="514" y="174" width="246" height="64" rx="10" fill="#F3EFE4"/>
  <rect x="514" y="174" width="4" height="64" rx="2" fill="#15A06A"/>
  <text x="534" y="200" fill="#16190F" font-size="13" font-weight="700">2 · Booker time</text>
  <text x="534" y="220" fill="#5A6357" font-size="11">Rett inn i kalenderen, med bekreftelse</text>

  <!-- Outcome 3 -->
  <rect x="514" y="268" width="246" height="64" rx="10" fill="#F3EFE4" opacity="0.92"/>
  <rect x="514" y="268" width="4" height="64" rx="2" fill="#9FB3A7"/>
  <text x="534" y="294" fill="#16190F" font-size="13" font-weight="700">3 · Sender videre</text>
  <text x="534" y="314" fill="#5A6357" font-size="11">Kvalifisert lead til deg - når skjønn kreves</text>

  <!-- footer stat bar -->
  <line x1="40" y1="356" x2="760" y2="356" stroke="#1B3A2B" stroke-width="1"/>
  <text x="40" y="384" fill="#3FE0A0" font-size="17" font-weight="700">50-70 %</text>
  <text x="40" y="402" fill="#9FB3A7" font-size="11">av vanlige spørsmål løst uten menneske</text>
  <text x="300" y="384" fill="#3FE0A0" font-size="17" font-weight="700">~1 av 3</text>
  <text x="300" y="402" fill="#9FB3A7" font-size="11">henvendelser utenfor åpningstid</text>
  <text x="560" y="384" fill="#3FE0A0" font-size="17" font-weight="700">300-1 500 kr</text>
  <text x="560" y="402" fill="#9FB3A7" font-size="11">typisk månedspris for en småbedrift</text>
</svg>
