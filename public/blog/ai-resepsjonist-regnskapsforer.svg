<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <rect width="800" height="420" fill="#0B2118"/>

  <text x="40" y="46" fill="#EFEDE2" font-size="21" font-weight="700">AI-resepsjonist for regnskapsfører</text>
  <text x="40" y="70" fill="#9FB3A7" font-size="13">Fristuken: 31 anrop inn - 23 tas av førstelinjen, 8 går videre til fagperson</text>
  <line x1="40" y1="86" x2="760" y2="86" stroke="#15C07C" stroke-opacity="0.25" stroke-width="1"/>

  <!-- Column 1: incoming -->
  <rect x="40" y="112" width="176" height="232" rx="12" fill="#F3EFE4" stroke="#E6E0D0"/>
  <text x="60" y="140" fill="#16190F" font-size="13" font-weight="700">INNKOMMENDE</text>
  <text x="60" y="176" fill="#15A06A" font-size="30" font-weight="700">31</text>
  <text x="60" y="194" fill="#16190F" font-size="11" opacity="0.7">anrop i fristuken</text>
  <text x="60" y="226" fill="#16190F" font-size="11.5">08:12  MVA-frist?</text>
  <text x="60" y="248" fill="#16190F" font-size="11.5">10:40  Mangler bilag</text>
  <text x="60" y="270" fill="#16190F" font-size="11.5">14:05  Portalinnlogging</text>
  <text x="60" y="292" fill="#16190F" font-size="11.5">19:55  Ny kunde, pris</text>
  <text x="60" y="314" fill="#16190F" font-size="11.5">22:30  Status årsoppgjør</text>

  <!-- Arrow 1 -->
  <line x1="224" y1="228" x2="286" y2="228" stroke="#15C07C" stroke-width="2"/>
  <path d="M286 222 L298 228 L286 234 Z" fill="#15C07C"/>

  <!-- Column 2: AI first line -->
  <rect x="306" y="112" width="176" height="232" rx="12" fill="#15C07C" fill-opacity="0.12" stroke="#15C07C"/>
  <text x="326" y="140" fill="#3FE0A0" font-size="13" font-weight="700">AI-FØRSTELINJE</text>
  <text x="326" y="162" fill="#9FB3A7" font-size="11">24/7 - på norsk</text>
  <circle cx="332" cy="188" r="3" fill="#3FE0A0"/>
  <text x="344" y="192" fill="#EFEDE2" font-size="11.5">Svarer på frister</text>
  <circle cx="332" cy="212" r="3" fill="#3FE0A0"/>
  <text x="344" y="216" fill="#EFEDE2" font-size="11.5">Purrer manglende bilag</text>
  <circle cx="332" cy="236" r="3" fill="#3FE0A0"/>
  <text x="344" y="240" fill="#EFEDE2" font-size="11.5">Leveringsstatus</text>
  <circle cx="332" cy="260" r="3" fill="#3FE0A0"/>
  <text x="344" y="264" fill="#EFEDE2" font-size="11.5">Booker møter</text>
  <circle cx="332" cy="284" r="3" fill="#3FE0A0"/>
  <text x="344" y="288" fill="#EFEDE2" font-size="11.5">Kvalifiserer nye kunder</text>
  <circle cx="332" cy="308" r="3" fill="#3FE0A0"/>
  <text x="344" y="312" fill="#EFEDE2" font-size="11.5">Flagger hastesaker</text>

  <!-- Split arrows -->
  <line x1="490" y1="228" x2="530" y2="176" stroke="#3FE0A0" stroke-width="2"/>
  <path d="M525 170 L534 168 L533 180 Z" fill="#3FE0A0"/>
  <line x1="490" y1="228" x2="530" y2="288" stroke="#15C07C" stroke-width="2"/>
  <path d="M525 294 L534 296 L533 284 Z" fill="#15C07C"/>

  <!-- Outcome A: resolved -->
  <rect x="546" y="112" width="214" height="98" rx="12" fill="#3FE0A0" fill-opacity="0.14" stroke="#3FE0A0"/>
  <text x="566" y="140" fill="#3FE0A0" font-size="42" font-weight="700">23</text>
  <text x="566" y="164" fill="#EFEDE2" font-size="12" font-weight="600">løst i samtalen</text>
  <text x="566" y="186" fill="#9FB3A7" font-size="11">Faktaspørsmål og logistikk -</text>
  <text x="566" y="200" fill="#9FB3A7" font-size="11">ingen rådgiver avbrutt</text>

  <!-- Outcome B: routed -->
  <rect x="546" y="246" width="214" height="98" rx="12" fill="#F3EFE4" stroke="#E6E0D0"/>
  <text x="566" y="286" fill="#15A06A" font-size="42" font-weight="700">8</text>
  <text x="566" y="310" fill="#16190F" font-size="12" font-weight="600">til autorisert regnskapsfører</text>
  <text x="566" y="330" fill="#16190F" font-size="11" opacity="0.7">Faglige saker - med all kontekst klar</text>

  <!-- Footer -->
  <line x1="40" y1="368" x2="760" y2="368" stroke="#15C07C" stroke-opacity="0.2"/>
  <text x="40" y="394" fill="#9FB3A7" font-size="11.5">Grensen settes av byrået: faktaspørsmål besvares, faglige vurderinger rutes alltid videre.</text>
  <text x="694" y="394" fill="#15C07C" font-size="12" font-weight="700">KI Consult</text>
</svg>
