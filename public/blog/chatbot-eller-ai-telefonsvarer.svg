<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <rect width="800" height="420" fill="#0B2118"/>

  <text x="400" y="42" text-anchor="middle" fill="#EFEDE2" font-size="21" font-weight="600">Chatbot eller AI-telefonsvarer?</text>
  <text x="400" y="66" text-anchor="middle" fill="#9FB3A7" font-size="13">To kanaler, to typer kunder - i to ulike faser av kjopet</text>

  <!-- Left card: chatbot -->
  <rect x="48" y="92" width="322" height="238" rx="14" fill="#F3EFE4" stroke="#E6E0D0" stroke-width="1"/>
  <rect x="48" y="92" width="322" height="46" rx="14" fill="#15C07C"/>
  <rect x="48" y="124" width="322" height="14" fill="#15C07C"/>
  <text x="72" y="122" fill="#0B2118" font-size="16" font-weight="700">Chatbot pa nettside</text>

  <text x="72" y="170" fill="#16190F" font-size="13" font-weight="600">Skriftlig, pa nettsiden din</text>
  <line x1="72" y1="182" x2="346" y2="182" stroke="#E6E0D0" stroke-width="1"/>

  <circle cx="79" cy="204" r="4" fill="#15A06A"/>
  <text x="94" y="209" fill="#16190F" font-size="13">Fase: research og sammenligning</text>
  <circle cx="79" cy="232" r="4" fill="#15A06A"/>
  <text x="94" y="237" fill="#16190F" font-size="13">Mange henvendelser, lav verdi</text>
  <circle cx="79" cy="260" r="4" fill="#15A06A"/>
  <text x="94" y="265" fill="#16190F" font-size="13">Rask oppstart, lav kostnad</text>
  <circle cx="79" cy="288" r="4" fill="#15A06A"/>
  <text x="94" y="293" fill="#16190F" font-size="13">Krever at kunden finner deg</text>

  <text x="72" y="318" fill="#15A06A" font-size="13" font-weight="700">~5 % blir salg</text>

  <!-- Right card: AI telefonsvarer -->
  <rect x="430" y="92" width="322" height="238" rx="14" fill="#F3EFE4" stroke="#E6E0D0" stroke-width="1"/>
  <rect x="430" y="92" width="322" height="46" rx="14" fill="#3FE0A0"/>
  <rect x="430" y="124" width="322" height="14" fill="#3FE0A0"/>
  <text x="454" y="122" fill="#0B2118" font-size="16" font-weight="700">AI-telefonsvarer</text>

  <text x="454" y="170" fill="#16190F" font-size="13" font-weight="600">Muntlig, hvor som helst</text>
  <line x1="454" y1="182" x2="728" y2="182" stroke="#E6E0D0" stroke-width="1"/>

  <circle cx="461" cy="204" r="4" fill="#15A06A"/>
  <text x="476" y="209" fill="#16190F" font-size="13">Fase: beslutning eller hastesak</text>
  <circle cx="461" cy="232" r="4" fill="#15A06A"/>
  <text x="476" y="237" fill="#16190F" font-size="13">Faerre henvendelser, hoy verdi</text>
  <circle cx="461" cy="260" r="4" fill="#15A06A"/>
  <text x="476" y="265" fill="#16190F" font-size="13">Fullforer booking i samtalen</text>
  <circle cx="461" cy="288" r="4" fill="#15A06A"/>
  <text x="476" y="293" fill="#16190F" font-size="13">Krever ryddig kalender</text>

  <text x="454" y="318" fill="#15A06A" font-size="13" font-weight="700">~25 % blir salg</text>

  <!-- Center divider -->
  <line x1="400" y1="104" x2="400" y2="318" stroke="#15C07C" stroke-width="1" stroke-dasharray="4 6" opacity="0.5"/>
  <circle cx="400" cy="211" r="19" fill="#0B2118" stroke="#15C07C" stroke-width="1.5"/>
  <text x="400" y="216" text-anchor="middle" fill="#3FE0A0" font-size="12" font-weight="700">vs</text>

  <!-- Footer band -->
  <rect x="48" y="350" width="704" height="44" rx="10" fill="#15C07C" opacity="0.12"/>
  <rect x="48" y="350" width="4" height="44" rx="2" fill="#3FE0A0"/>
  <text x="72" y="370" fill="#EFEDE2" font-size="13" font-weight="600">Begge kanaler, en kunnskapsbase og en kalender</text>
  <text x="72" y="387" fill="#9FB3A7" font-size="12">1 av 3 henvendelser kommer utenfor apningstid - uansett kanal</text>
  <text x="728" y="380" text-anchor="end" fill="#3FE0A0" font-size="13" font-weight="700">KI Consult</text>
</svg>
