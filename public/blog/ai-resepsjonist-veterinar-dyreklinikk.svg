<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <rect width="800" height="420" fill="#0B2118"/>

  <text x="40" y="46" fill="#EFEDE2" font-size="20" font-weight="600">AI-resepsjonist for veterinær og dyreklinikk</text>
  <text x="40" y="70" fill="#9FB3A7" font-size="13">Fra anrop til bekreftet time - uten at noen forlater behandlingsrommet</text>

  <line x1="40" y1="86" x2="760" y2="86" stroke="#15C07C" stroke-width="1" opacity="0.35"/>

  <!-- Left column: inbound calls -->
  <text x="40" y="116" fill="#3FE0A0" font-size="12" font-weight="600" letter-spacing="1">EIEREN RINGER</text>

  <g>
    <rect x="40" y="128" width="196" height="52" rx="10" fill="#123024" stroke="#1E4A37"/>
    <text x="56" y="150" fill="#EFEDE2" font-size="13" font-weight="600">Kl. 07:20</text>
    <text x="56" y="168" fill="#9FB3A7" font-size="12">Katten kaster opp - haster det?</text>
  </g>
  <g>
    <rect x="40" y="188" width="196" height="52" rx="10" fill="#123024" stroke="#1E4A37"/>
    <text x="56" y="210" fill="#EFEDE2" font-size="13" font-weight="600">Kl. 12:30</text>
    <text x="56" y="228" fill="#9FB3A7" font-size="12">Vaksine til valpen</text>
  </g>
  <g>
    <rect x="40" y="248" width="196" height="52" rx="10" fill="#123024" stroke="#1E4A37"/>
    <text x="56" y="270" fill="#EFEDE2" font-size="13" font-weight="600">Kl. 21:45</text>
    <text x="56" y="288" fill="#9FB3A7" font-size="12">Hunden halter etter tur</text>
  </g>
  <g>
    <rect x="40" y="308" width="196" height="52" rx="10" fill="#123024" stroke="#1E4A37"/>
    <text x="56" y="330" fill="#EFEDE2" font-size="13" font-weight="600">Lørdag</text>
    <text x="56" y="348" fill="#9FB3A7" font-size="12">Fôr og medisin skal hentes</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M244 244 L286 244" stroke="#15C07C" stroke-width="2" fill="none"/>
  <path d="M286 244 l-8 -5 v10 z" fill="#15C07C"/>

  <!-- Middle: AI receptionist -->
  <rect x="294" y="128" width="196" height="232" rx="14" fill="#15C07C" opacity="0.12"/>
  <rect x="294" y="128" width="196" height="232" rx="14" fill="none" stroke="#15C07C" stroke-width="1.5"/>
  <text x="392" y="160" fill="#3FE0A0" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="1">KI CONSULT</text>
  <text x="392" y="182" fill="#EFEDE2" font-size="16" font-weight="600" text-anchor="middle">AI-resepsjonist</text>
  <text x="392" y="202" fill="#9FB3A7" font-size="12" text-anchor="middle">Svarer på norsk, 24/7</text>

  <line x1="316" y1="216" x2="468" y2="216" stroke="#1E4A37" stroke-width="1"/>

  <text x="316" y="240" fill="#EFEDE2" font-size="12">1. Triage: haster det?</text>
  <text x="316" y="264" fill="#EFEDE2" font-size="12">2. Dyr, art, symptom</text>
  <text x="316" y="288" fill="#EFEDE2" font-size="12">3. Ledig time i journal</text>
  <text x="316" y="312" fill="#EFEDE2" font-size="12">4. SMS-bekreftelse</text>
  <text x="316" y="336" fill="#EFEDE2" font-size="12">5. Logg til klinikken</text>

  <!-- Arrow 2 -->
  <path d="M498 244 L540 244" stroke="#15C07C" stroke-width="2" fill="none"/>
  <path d="M540 244 l-8 -5 v10 z" fill="#15C07C"/>

  <!-- Right column: outcomes -->
  <text x="548" y="116" fill="#3FE0A0" font-size="12" font-weight="600" letter-spacing="1">RESULTAT</text>

  <g>
    <rect x="548" y="128" width="212" height="66" rx="10" fill="#F3EFE4"/>
    <text x="566" y="152" fill="#15A06A" font-size="20" font-weight="700">AKUTT</text>
    <text x="566" y="172" fill="#16190F" font-size="12">Settes rett til vakthavende</text>
    <text x="566" y="188" fill="#16190F" font-size="12" opacity="0.7">veterinær eller vaktklinikk</text>
  </g>
  <g>
    <rect x="548" y="204" width="212" height="66" rx="10" fill="#F3EFE4"/>
    <text x="566" y="228" fill="#15A06A" font-size="20" font-weight="700">BOOKET</text>
    <text x="566" y="248" fill="#16190F" font-size="12">Time i kalenderen med</text>
    <text x="566" y="264" fill="#16190F" font-size="12" opacity="0.7">dyrets navn og journalnr.</text>
  </g>
  <g>
    <rect x="548" y="280" width="212" height="80" rx="10" fill="#F3EFE4"/>
    <text x="566" y="304" fill="#15A06A" font-size="20" font-weight="700">BESVART</text>
    <text x="566" y="324" fill="#16190F" font-size="12">Priser, åpningstider, faste</text>
    <text x="566" y="340" fill="#16190F" font-size="12" opacity="0.7">spørsmål - uten kø</text>
  </g>

  <text x="40" y="394" fill="#9FB3A7" font-size="12">Telefontid 08-12 og 13-16 fanger ikke opp anropene som kommer tidlig, sent og i helgen.</text>
  <text x="40" y="410" fill="#15C07C" font-size="12" font-weight="600">kiconsult.no</text>
</svg>
