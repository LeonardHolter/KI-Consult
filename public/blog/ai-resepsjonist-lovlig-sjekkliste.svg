<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <rect width="1200" height="630" fill="#0B2118"/>
  <ellipse cx="950" cy="720" rx="650" ry="320" fill="#15C07C" opacity="0.10"/>

  <text x="60" y="70" font-size="20" letter-spacing="4" fill="#3FE0A0" font-weight="700">LOVLIG AI-RESEPSJONIST: DETTE ER FAKTISK PÅLAGT</text>

  <!-- Answer badge -->
  <rect x="60" y="100" width="300" height="56" rx="28" fill="#15C07C"/>
  <text x="210" y="137" font-size="26" fill="#08231A" font-weight="800" text-anchor="middle">JA, det er lovlig</text>
  <text x="390" y="137" font-size="20" fill="#E0A92B" font-weight="700">KI-loven gjelder i EU fra august 2026</text>

  <!-- Checklist card -->
  <g>
    <rect x="60" y="190" width="1080" height="330" rx="18" fill="#123324" stroke="#15C07C" stroke-width="3"/>

    <circle cx="130" cy="270" r="24" fill="#15C07C"/><text x="130" y="280" font-size="26" fill="#08231A" font-weight="800" text-anchor="middle">1</text>
    <text x="180" y="262" font-size="28" fill="#EFEDE2" font-weight="800">Si fra at det er KI</text>
    <text x="180" y="294" font-size="18" fill="#9BB3A4">«Hei, du snakker med den digitale resepsjonisten til …» - én setning holder</text>

    <circle cx="130" cy="370" r="24" fill="#15C07C"/><text x="130" y="380" font-size="26" fill="#08231A" font-weight="800" text-anchor="middle">2</text>
    <text x="180" y="362" font-size="28" fill="#EFEDE2" font-weight="800">Informer om hva som lagres</text>
    <text x="180" y="394" font-size="18" fill="#9BB3A4">nevn samtaledata i personvernerklæringen - og si fra om eventuelle opptak</text>

    <circle cx="130" cy="470" r="24" fill="#15C07C"/><text x="130" y="480" font-size="26" fill="#08231A" font-weight="800" text-anchor="middle">3</text>
    <text x="180" y="462" font-size="28" fill="#EFEDE2" font-weight="800">Signer databehandleravtalen</text>
    <text x="180" y="494" font-size="18" fill="#9BB3A4">leverandøren har den ferdig - du skal bare slippe å mase om den</text>
  </g>

  <!-- Bottom bar -->
  <rect x="60" y="550" width="1080" height="1" fill="#2A4A38"/>
  <text x="600" y="595" font-size="17" fill="#9BB3A4" text-anchor="middle">Resten - risikoklasser, lagringsregler, overføringsgrunnlag - er leverandørens jobb, ikke din</text>
</svg>
