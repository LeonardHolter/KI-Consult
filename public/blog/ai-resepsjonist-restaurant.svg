<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AI-resepsjonist for restaurant: fra ubesvart anrop til bekreftet bord" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#15C07C"/>
    </marker>
  </defs>

  <rect width="800" height="420" rx="18" fill="#0B2118"/>

  <!-- Header -->
  <text x="40" y="52" fill="#EFEDE2" font-size="23" font-weight="700">AI-resepsjonist for restaurant</text>
  <text x="40" y="78" fill="#9FB3A7" font-size="14">Fra ubesvart anrop midt i rushet til bekreftet bord i bordkartet</text>
  <text x="760" y="52" fill="#15C07C" font-size="14" font-weight="700" text-anchor="end">KI Consult</text>
  <line x1="40" y1="96" x2="760" y2="96" stroke="#15C07C" stroke-opacity="0.25" stroke-width="1"/>

  <!-- Step 1 -->
  <rect x="40" y="120" width="160" height="132" rx="12" fill="#12301F" stroke="#15C07C" stroke-opacity="0.35"/>
  <circle cx="64" cy="146" r="12" fill="#15A06A"/>
  <text x="64" y="151" fill="#0B2118" font-size="13" font-weight="700" text-anchor="middle">1</text>
  <text x="86" y="151" fill="#EFEDE2" font-size="14" font-weight="600">Gjesten ringer</text>
  <text x="60" y="182" fill="#3FE0A0" font-size="26" font-weight="700">18:40</text>
  <text x="60" y="206" fill="#9FB3A7" font-size="12.5">Midt i middagsrushet</text>
  <text x="60" y="224" fill="#9FB3A7" font-size="12.5">- ingen har en hånd ledig</text>
  <text x="60" y="242" fill="#9FB3A7" font-size="12.5">Bord for 6 på fredag</text>

  <line x1="206" y1="186" x2="238" y2="186" stroke="#15C07C" stroke-width="2" marker-end="url(#arw)"/>

  <!-- Step 2 -->
  <rect x="246" y="120" width="180" height="132" rx="12" fill="#12301F" stroke="#15C07C" stroke-opacity="0.35"/>
  <circle cx="270" cy="146" r="12" fill="#15A06A"/>
  <text x="270" y="151" fill="#0B2118" font-size="13" font-weight="700" text-anchor="middle">2</text>
  <text x="292" y="151" fill="#EFEDE2" font-size="14" font-weight="600">AI svarer på norsk</text>
  <text x="266" y="180" fill="#EFEDE2" font-size="12.5">Dato, tid og antall gjester</text>
  <text x="266" y="200" fill="#EFEDE2" font-size="12.5">Allergier noteres</text>
  <text x="266" y="220" fill="#EFEDE2" font-size="12.5">Meny og åpningstider</text>
  <text x="266" y="240" fill="#EFEDE2" font-size="12.5">Nummer leses tilbake</text>

  <line x1="432" y1="186" x2="464" y2="186" stroke="#15C07C" stroke-width="2" marker-end="url(#arw)"/>

  <!-- Step 3 -->
  <rect x="472" y="120" width="140" height="132" rx="12" fill="#12301F" stroke="#15C07C" stroke-opacity="0.35"/>
  <circle cx="496" cy="146" r="12" fill="#15A06A"/>
  <text x="496" y="151" fill="#0B2118" font-size="13" font-weight="700" text-anchor="middle">3</text>
  <text x="518" y="151" fill="#EFEDE2" font-size="14" font-weight="600">Bordkartet</text>
  <text x="492" y="178" fill="#9FB3A7" font-size="12.5">19:00 fullt</text>
  <text x="492" y="200" fill="#3FE0A0" font-size="12.5" font-weight="600">19:45 ledig -&gt; tilbys</text>
  <text x="492" y="222" fill="#9FB3A7" font-size="12.5">Skrives i sanntid</text>
  <text x="492" y="242" fill="#9FB3A7" font-size="12.5">Notat til kjøkkenet</text>

  <line x1="618" y1="186" x2="650" y2="186" stroke="#15C07C" stroke-width="2" marker-end="url(#arw)"/>

  <!-- Step 4 -->
  <rect x="658" y="120" width="102" height="132" rx="12" fill="#15C07C"/>
  <text x="709" y="158" fill="#0B2118" font-size="13" font-weight="700" text-anchor="middle">Bekreftet</text>
  <text x="709" y="176" fill="#0B2118" font-size="13" font-weight="700" text-anchor="middle">bord</text>
  <text x="709" y="204" fill="#0B2118" font-size="12" text-anchor="middle" opacity="0.8">SMS med en gang</text>
  <text x="709" y="222" fill="#0B2118" font-size="12" text-anchor="middle" opacity="0.8">Påminnelse dagen</text>
  <text x="709" y="238" fill="#0B2118" font-size="12" text-anchor="middle" opacity="0.8">før besøket</text>

  <!-- Bottom stat band -->
  <rect x="40" y="284" width="720" height="98" rx="12" fill="#F3EFE4"/>
  <text x="60" y="310" fill="#16190F" font-size="12.5" font-weight="600" opacity="0.7">HVA TELEFONEN LEKKER I DAG</text>

  <text x="60" y="352" fill="#15A06A" font-size="25" font-weight="700">~1 av 5</text>
  <text x="60" y="371" fill="#16190F" font-size="12" opacity="0.75">anrop går ubesvart</text>

  <text x="250" y="352" fill="#15A06A" font-size="25" font-weight="700">1 av 3</text>
  <text x="250" y="371" fill="#16190F" font-size="12" opacity="0.75">ringer utenfor åpningstid</text>

  <text x="450" y="352" fill="#15A06A" font-size="25" font-weight="700">24/7</text>
  <text x="450" y="371" fill="#16190F" font-size="12" opacity="0.75">AI-en tar bord også når dere har stengt</text>

  <line x1="230" y1="316" x2="230" y2="366" stroke="#E6E0D0" stroke-width="1.5"/>
  <line x1="430" y1="316" x2="430" y2="366" stroke="#E6E0D0" stroke-width="1.5"/>
</svg>
