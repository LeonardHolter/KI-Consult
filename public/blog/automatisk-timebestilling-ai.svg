<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" font-family="system-ui, sans-serif" role="img" aria-label="Automatisk timebestilling med AI: henvendelser fra telefon, chat og skjema samles av KI-resepsjonisten som sjekker kalenderen, booker riktig varighet og sender SMS-bekreftelse">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#15C07C"/>
    </marker>
    <marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#3FE0A0"/>
    </marker>
  </defs>

  <rect width="800" height="420" rx="16" fill="#0B2118"/>

  <text x="40" y="46" fill="#EFEDE2" font-size="21" font-weight="700">Automatisk timebestilling med KI</text>
  <text x="40" y="70" fill="#9FB3A7" font-size="13">Fra henvendelse til bekreftet time - i én samtale, hele døgnet</text>
  <text x="760" y="46" fill="#15C07C" font-size="13" font-weight="700" text-anchor="end">KI Consult</text>
  <line x1="40" y1="86" x2="760" y2="86" stroke="#15C07C" stroke-opacity="0.25" stroke-width="1"/>

  <!-- Column 1: inbound channels -->
  <text x="40" y="116" fill="#9FB3A7" font-size="11" font-weight="700" letter-spacing="1.2">1. KUNDEN TAR KONTAKT</text>

  <g>
    <rect x="40" y="128" width="168" height="52" rx="10" fill="#12301F" stroke="#15C07C" stroke-opacity="0.4"/>
    <circle cx="66" cy="154" r="13" fill="#15C07C" fill-opacity="0.18"/>
    <path d="M61 149 q3 -3 6 0 l2 4 -3 3 q2 4 6 6 l3 -3 4 2 q3 3 0 6 -6 4 -13 -4 -8 -8 -5 -14 z" fill="#3FE0A0"/>
    <text x="90" y="151" fill="#EFEDE2" font-size="14" font-weight="600">Telefon</text>
    <text x="90" y="168" fill="#9FB3A7" font-size="11">Ringer, også kl. 21</text>
  </g>

  <g>
    <rect x="40" y="190" width="168" height="52" rx="10" fill="#12301F" stroke="#15C07C" stroke-opacity="0.4"/>
    <circle cx="66" cy="216" r="13" fill="#15C07C" fill-opacity="0.18"/>
    <path d="M58 209 h16 a3 3 0 0 1 3 3 v10 a3 3 0 0 1 -3 3 h-9 l-6 5 v-5 h-1 a3 3 0 0 1 -3 -3 v-10 a3 3 0 0 1 3 -3 z" fill="#3FE0A0"/>
    <text x="90" y="213" fill="#EFEDE2" font-size="14" font-weight="600">Nettchat</text>
    <text x="90" y="230" fill="#9FB3A7" font-size="11">Spør før booking</text>
  </g>

  <g>
    <rect x="40" y="252" width="168" height="52" rx="10" fill="#12301F" stroke="#15C07C" stroke-opacity="0.4"/>
    <circle cx="66" cy="278" r="13" fill="#15C07C" fill-opacity="0.18"/>
    <rect x="59" y="270" width="14" height="16" rx="2" fill="#3FE0A0"/>
    <rect x="62" y="274" width="8" height="1.6" fill="#0B2118"/>
    <rect x="62" y="278" width="8" height="1.6" fill="#0B2118"/>
    <rect x="62" y="282" width="5" height="1.6" fill="#0B2118"/>
    <text x="90" y="275" fill="#EFEDE2" font-size="14" font-weight="600">Skjema</text>
    <text x="90" y="292" fill="#9FB3A7" font-size="11">Nettsiden din</text>
  </g>

  <path d="M212 154 C 240 154, 244 200, 268 208" stroke="#15C07C" stroke-width="2" fill="none" marker-end="url(#ar)" opacity="0.85"/>
  <path d="M212 216 L 268 216" stroke="#15C07C" stroke-width="2" fill="none" marker-end="url(#ar)" opacity="0.85"/>
  <path d="M212 278 C 240 278, 244 232, 268 224" stroke="#15C07C" stroke-width="2" fill="none" marker-end="url(#ar)" opacity="0.85"/>

  <!-- Column 2: AI core -->
  <text x="278" y="116" fill="#9FB3A7" font-size="11" font-weight="700" letter-spacing="1.2">2. KI-RESEPSJONISTEN</text>

  <rect x="278" y="128" width="196" height="176" rx="12" fill="#15C07C" fill-opacity="0.13" stroke="#15C07C" stroke-width="1.5"/>
  <text x="376" y="156" fill="#3FE0A0" font-size="15" font-weight="700" text-anchor="middle">Forstår norsk tale</text>

  <rect x="294" y="170" width="164" height="28" rx="7" fill="#0B2118" stroke="#15C07C" stroke-opacity="0.35"/>
  <text x="306" y="189" fill="#EFEDE2" font-size="12">Hvilken tjeneste?</text>

  <rect x="294" y="204" width="164" height="28" rx="7" fill="#0B2118" stroke="#15C07C" stroke-opacity="0.35"/>
  <text x="306" y="223" fill="#EFEDE2" font-size="12">Hvor lang tid?</text>

  <rect x="294" y="238" width="164" height="28" rx="7" fill="#0B2118" stroke="#15C07C" stroke-opacity="0.35"/>
  <text x="306" y="257" fill="#EFEDE2" font-size="12">Hvem utfører den?</text>

  <text x="376" y="290" fill="#9FB3A7" font-size="11" text-anchor="middle">Setter over til menneske ved tvil</text>

  <path d="M478 216 L 534 216" stroke="#3FE0A0" stroke-width="2" fill="none" marker-end="url(#ar2)"/>

  <!-- Column 3: calendar + confirmation -->
  <text x="544" y="116" fill="#9FB3A7" font-size="11" font-weight="700" letter-spacing="1.2">3. KALENDER OG BEKREFTELSE</text>

  <rect x="544" y="128" width="216" height="106" rx="10" fill="#F3EFE4" stroke="#E6E0D0"/>
  <rect x="544" y="128" width="216" height="26" rx="10" fill="#15A06A"/>
  <rect x="544" y="146" width="216" height="8" fill="#15A06A"/>
  <text x="558" y="146" fill="#F3EFE4" font-size="12" font-weight="700">Kalenderen din</text>
  <text x="746" y="146" fill="#F3EFE4" font-size="11" text-anchor="end">i sanntid</text>

  <rect x="556" y="164" width="192" height="18" rx="4" fill="#15C07C" fill-opacity="0.22"/>
  <text x="564" y="177" fill="#16190F" font-size="11">09:00  Kort tjeneste - 30 min</text>

  <rect x="556" y="186" width="192" height="18" rx="4" fill="#15C07C" fill-opacity="0.45"/>
  <text x="564" y="199" fill="#16190F" font-size="11" font-weight="700">11:00  Ny booking - 90 min</text>

  <rect x="556" y="208" width="192" height="18" rx="4" fill="#E6E0D0"/>
  <text x="564" y="221" fill="#16190F" font-size="11">14:00  Ledig luke</text>

  <rect x="544" y="246" width="216" height="58" rx="10" fill="#12301F" stroke="#15C07C" stroke-opacity="0.4"/>
  <circle cx="570" cy="275" r="13" fill="#15C07C" fill-opacity="0.18"/>
  <rect x="564" y="268" width="12" height="15" rx="2.5" fill="#3FE0A0"/>
  <rect x="566.5" y="271" width="7" height="8" fill="#0B2118"/>
  <text x="594" y="270" fill="#EFEDE2" font-size="13" font-weight="600">SMS-bekreftelse</text>
  <text x="594" y="287" fill="#9FB3A7" font-size="11">+ påminnelse mot no-show</text>

  <!-- Bottom bar -->
  <rect x="40" y="330" width="720" height="58" rx="10" fill="#12301F" stroke="#15C07C" stroke-opacity="0.3"/>
  <text x="130" y="356" fill="#3FE0A0" font-size="19" font-weight="700" text-anchor="middle">24/7</text>
  <text x="130" y="374" fill="#9FB3A7" font-size="11" text-anchor="middle">tar imot bookinger</text>
  <line x1="250" y1="346" x2="250" y2="372" stroke="#15C07C" stroke-opacity="0.25"/>
  <text x="370" y="356" fill="#3FE0A0" font-size="19" font-weight="700" text-anchor="middle">&lt; 60 sek</text>
  <text x="370" y="374" fill="#9FB3A7" font-size="11" text-anchor="middle">fra anrop til bekreftet time</text>
  <line x1="490" y1="346" x2="490" y2="372" stroke="#15C07C" stroke-opacity="0.25"/>
  <text x="620" y="356" fill="#3FE0A0" font-size="19" font-weight="700" text-anchor="middle">0</text>
  <text x="620" y="374" fill="#9FB3A7" font-size="11" text-anchor="middle">tilbakeringinger i kø</text>
</svg>
