<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" role="img" aria-label="AI-resepsjonist for advokatkontor: henvendelser fanges opp 24/7, kvalifiseres og rutes videre">
  <rect width="800" height="420" fill="#0B2118"/>

  <text x="40" y="46" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#EFEDE2">AI-resepsjonist for advokatkontor</text>
  <text x="40" y="70" font-family="system-ui, sans-serif" font-size="13" fill="#9FB3A7">Fra ubesvart anrop til kvalifisert mandat - uten at advokaten blir avbrutt</text>
  <line x1="40" y1="86" x2="760" y2="86" stroke="#15C07C" stroke-opacity="0.25" stroke-width="1"/>

  <!-- Column 1: incoming -->
  <text x="40" y="118" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#9FB3A7" letter-spacing="1">HENVENDELSER</text>

  <rect x="40" y="130" width="176" height="42" rx="8" fill="#12301F" stroke="#15C07C" stroke-opacity="0.35"/>
  <text x="56" y="149" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#EFEDE2">07:40 - for kontortid</text>
  <text x="56" y="164" font-family="system-ui, sans-serif" font-size="11" fill="#9FB3A7">Oppsigelse mottatt i gar</text>

  <rect x="40" y="182" width="176" height="42" rx="8" fill="#12301F" stroke="#15C07C" stroke-opacity="0.35"/>
  <text x="56" y="201" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#EFEDE2">11:15 - i rettsmote</text>
  <text x="56" y="216" font-family="system-ui, sans-serif" font-size="11" fill="#9FB3A7">Arveoppgjor, ny klient</text>

  <rect x="40" y="234" width="176" height="42" rx="8" fill="#12301F" stroke="#15C07C" stroke-opacity="0.35"/>
  <text x="56" y="253" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#EFEDE2">21:30 - kveld</text>
  <text x="56" y="268" font-family="system-ui, sans-serif" font-size="11" fill="#9FB3A7">Samlivsbrudd, haster</text>

  <rect x="40" y="286" width="176" height="42" rx="8" fill="#12301F" stroke="#15C07C" stroke-opacity="0.35"/>
  <text x="56" y="305" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#EFEDE2">Lordag - nettskjema</text>
  <text x="56" y="320" font-family="system-ui, sans-serif" font-size="11" fill="#9FB3A7">Tvist med handverker</text>

  <!-- Arrow 1 -->
  <path d="M224 229 L268 229" stroke="#15C07C" stroke-width="2" fill="none"/>
  <path d="M268 229 l-8 -5 v10 z" fill="#15C07C"/>

  <!-- Column 2: AI -->
  <rect x="276" y="130" width="196" height="198" rx="12" fill="#15C07C" fill-opacity="0.10" stroke="#3FE0A0" stroke-width="1.5"/>
  <circle cx="374" cy="166" r="20" fill="#15C07C"/>
  <text x="374" y="172" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#0B2118" text-anchor="middle">KI</text>
  <text x="374" y="206" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#EFEDE2" text-anchor="middle">AI-resepsjonist</text>
  <text x="374" y="224" font-family="system-ui, sans-serif" font-size="11" fill="#3FE0A0" text-anchor="middle">Svarer pa forste ring - 24/7</text>

  <text x="296" y="250" font-family="system-ui, sans-serif" font-size="11" fill="#EFEDE2">1. Saksomrade og kort sammendrag</text>
  <text x="296" y="270" font-family="system-ui, sans-serif" font-size="11" fill="#EFEDE2">2. Motpartens navn - til konfliktsjekk</text>
  <text x="296" y="290" font-family="system-ui, sans-serif" font-size="11" fill="#EFEDE2">3. Frister og hastegrad</text>
  <text x="296" y="310" font-family="system-ui, sans-serif" font-size="11" fill="#EFEDE2">4. Rettshjelpsdekning og kontaktinfo</text>

  <!-- Arrow 2 -->
  <path d="M480 229 L524 229" stroke="#15C07C" stroke-width="2" fill="none"/>
  <path d="M524 229 l-8 -5 v10 z" fill="#15C07C"/>

  <!-- Column 3: outcomes -->
  <text x="532" y="118" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#9FB3A7" letter-spacing="1">UTFALL</text>

  <rect x="532" y="130" width="228" height="56" rx="8" fill="#F3EFE4"/>
  <rect x="532" y="130" width="4" height="56" rx="2" fill="#15A06A"/>
  <text x="548" y="152" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#16190F">Mote booket i kalenderen</text>
  <text x="548" y="170" font-family="system-ui, sans-serif" font-size="11" fill="#16190F" fill-opacity="0.7">Riktig advokat, riktig fagfelt, SMS sendt</text>

  <rect x="532" y="196" width="228" height="56" rx="8" fill="#F3EFE4"/>
  <rect x="532" y="196" width="4" height="56" rx="2" fill="#15A06A"/>
  <text x="548" y="218" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#16190F">Strukturert saksnotat</text>
  <text x="548" y="236" font-family="system-ui, sans-serif" font-size="11" fill="#16190F" fill-opacity="0.7">Klart for konfliktsjekk for forste mote</text>

  <rect x="532" y="262" width="228" height="56" rx="8" fill="#F3EFE4"/>
  <rect x="532" y="262" width="4" height="56" rx="2" fill="#15A06A"/>
  <text x="548" y="284" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#16190F">Frist? Advokat varsles straks</text>
  <text x="548" y="302" font-family="system-ui, sans-serif" font-size="11" fill="#16190F" fill-opacity="0.7">Klagefrist, soksmalsfrist, foreldelse</text>

  <!-- Guardrail bar -->
  <rect x="40" y="350" width="720" height="42" rx="8" fill="#0B2118" stroke="#9FB3A7" stroke-opacity="0.35" stroke-dasharray="4 4"/>
  <text x="60" y="367" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#3FE0A0">Grensen: aldri juridiske rad</text>
  <text x="60" y="383" font-family="system-ui, sans-serif" font-size="11" fill="#9FB3A7">AI-en samler inn og ruter. Vurdering av saken, konfliktsjekk og radgivning gjores av advokaten.</text>

  <text x="694" y="410" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#15C07C">KI Consult</text>
</svg>
