<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <rect width="800" height="420" fill="#0B2118"/>

  <text x="400" y="40" text-anchor="middle" fill="#EFEDE2" font-size="21" font-weight="600">Kveldsokonomien: nar kundene ringer</text>
  <text x="400" y="63" text-anchor="middle" fill="#9FB3A7" font-size="13">Typisk pagang gjennom dognet for en lokal tjenestebedrift</text>

  <!-- Closed-hours shading -->
  <rect x="452" y="86" width="296" height="222" rx="10" fill="#15C07C" opacity="0.07"/>
  <rect x="452" y="86" width="296" height="222" rx="10" fill="none" stroke="#3FE0A0" stroke-width="1" stroke-dasharray="5 4" opacity="0.5"/>
  <text x="600" y="106" text-anchor="middle" fill="#3FE0A0" font-size="12" font-weight="600">STENGT - ingen svarer</text>

  <!-- Open-hours label -->
  <text x="266" y="106" text-anchor="middle" fill="#9FB3A7" font-size="12" font-weight="600">APENT 08-16</text>

  <!-- Baseline -->
  <line x1="70" y1="300" x2="756" y2="300" stroke="#9FB3A7" stroke-width="1" opacity="0.35"/>

  <!-- Bars: open hours (solid green) -->
  <rect x="80"  y="280" width="34" height="20"  rx="3" fill="#15C07C" opacity="0.45"/>
  <rect x="122" y="225" width="34" height="75"  rx="3" fill="#15C07C"/>
  <rect x="164" y="170" width="34" height="130" rx="3" fill="#15C07C"/>
  <rect x="206" y="180" width="34" height="120" rx="3" fill="#15C07C"/>
  <rect x="248" y="195" width="34" height="105" rx="3" fill="#15C07C"/>
  <rect x="290" y="230" width="34" height="70"  rx="3" fill="#15C07C"/>
  <rect x="332" y="205" width="34" height="95"  rx="3" fill="#15C07C"/>
  <rect x="374" y="190" width="34" height="110" rx="3" fill="#15C07C"/>
  <rect x="416" y="175" width="34" height="125" rx="3" fill="#15C07C"/>

  <!-- Bars: after closing (outlined - unanswered) -->
  <rect x="458" y="182" width="34" height="118" rx="3" fill="#3FE0A0" opacity="0.22" stroke="#3FE0A0" stroke-width="1.5"/>
  <rect x="500" y="205" width="34" height="95"  rx="3" fill="#3FE0A0" opacity="0.22" stroke="#3FE0A0" stroke-width="1.5"/>
  <rect x="542" y="222" width="34" height="78"  rx="3" fill="#3FE0A0" opacity="0.22" stroke="#3FE0A0" stroke-width="1.5"/>
  <rect x="584" y="238" width="34" height="62"  rx="3" fill="#3FE0A0" opacity="0.22" stroke="#3FE0A0" stroke-width="1.5"/>
  <rect x="626" y="252" width="34" height="48"  rx="3" fill="#3FE0A0" opacity="0.22" stroke="#3FE0A0" stroke-width="1.5"/>
  <rect x="668" y="266" width="34" height="34"  rx="3" fill="#3FE0A0" opacity="0.22" stroke="#3FE0A0" stroke-width="1.5"/>
  <rect x="710" y="280" width="34" height="20"  rx="3" fill="#3FE0A0" opacity="0.22" stroke="#3FE0A0" stroke-width="1.5"/>

  <!-- Hour axis -->
  <g fill="#9FB3A7" font-size="11" text-anchor="middle">
    <text x="97"  y="318">07</text>
    <text x="139" y="318">08</text>
    <text x="181" y="318">09</text>
    <text x="223" y="318">10</text>
    <text x="265" y="318">11</text>
    <text x="307" y="318">12</text>
    <text x="349" y="318">13</text>
    <text x="391" y="318">14</text>
    <text x="433" y="318">15</text>
    <text x="475" y="318">16</text>
    <text x="517" y="318">17</text>
    <text x="559" y="318">18</text>
    <text x="601" y="318">19</text>
    <text x="643" y="318">20</text>
    <text x="685" y="318">21</text>
    <text x="727" y="318">22</text>
  </g>

  <!-- Bottom summary strip -->
  <rect x="48" y="336" width="704" height="58" rx="12" fill="#F3EFE4" stroke="#E6E0D0" stroke-width="1"/>

  <text x="140" y="362" text-anchor="middle" fill="#15A06A" font-size="19" font-weight="700">1 av 3</text>
  <text x="140" y="380" text-anchor="middle" fill="#16190F" font-size="11">henvendelser utenfor apningstid</text>

  <line x1="258" y1="350" x2="258" y2="380" stroke="#E6E0D0" stroke-width="1"/>

  <text x="352" y="362" text-anchor="middle" fill="#15A06A" font-size="19" font-weight="700">0 svar</text>
  <text x="352" y="380" text-anchor="middle" fill="#16190F" font-size="11">med talepostkasse pa kvelden</text>

  <line x1="470" y1="350" x2="470" y2="380" stroke="#E6E0D0" stroke-width="1"/>

  <text x="606" y="360" text-anchor="middle" fill="#16190F" font-size="13" font-weight="700">KI Consult svarer 24/7</text>
  <text x="606" y="380" text-anchor="middle" fill="#16190F" font-size="11">tar samtalen, booker timen, sender beskjed</text>
</svg>
