<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AI-resepsjonist for eiendomsmegler: fra anrop om en boligannonse til booket visning" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#15C07C"/>
    </marker>
  </defs>

  <rect width="800" height="420" rx="18" fill="#0B2118"/>

  <!-- Header -->
  <text x="40" y="52" fill="#EFEDE2" font-size="23" font-weight="700">AI-resepsjonist for eiendomsmegler</text>
  <text x="40" y="78" fill="#9FB3A7" font-size="14">Fra ubesvart anrop om en annonse til booket visning i meglerens kalender</text>
  <text x="760" y="52" fill="#15C07C" font-size="14" font-weight="700" text-anchor="end">KI Consult</text>
  <line x1="40" y1="96" x2="760" y2="96" stroke="#15C07C" stroke-opacity="0.25" stroke-width="1"/>

  <!-- Step 1 -->
  <rect x="40" y="120" width="162" height="142" rx="12" fill="#12301F" stroke="#15C07C" stroke-opacity="0.35"/>
  <circle cx="64" cy="146" r="12" fill="#15A06A"/>
  <text x="64" y="151" fill="#0B2118" font-size="13" font-weight="700" text-anchor="middle">1</text>
  <text x="86" y="151" fill="#EFEDE2" font-size="14" font-weight="600">Kjøper ringer</text>
  <text x="60" y="185" fill="#3FE0A0" font-size="25" font-weight="700">søn 20:15</text>
  <text x="60" y="209" fill="#9FB3A7" font-size="12.5">Sitter på FINN i sofaen</text>
  <text x="60" y="228" fill="#9FB3A7" font-size="12.5">Megleren er ikke på jobb</text>
  <text x="60" y="247" fill="#9FB3A7" font-size="12.5">Legger ikke igjen beskjed</text>

  <line x1="208" y1="191" x2="240" y2="191" stroke="#15C07C" stroke-width="2" marker-end="url(#arw)"/>

  <!-- Step 2 -->
  <rect x="248" y="120" width="184" height="142" rx="12" fill="#12301F" stroke="#15C07C" stroke-opacity="0.35"/>
  <circle cx="272" cy="146" r="12" fill="#15A06A"/>
  <text x="272" y="151" fill="#0B2118" font-size="13" font-weight="700" text-anchor="middle">2</text>
  <text x="294" y="151" fill="#EFEDE2" font-size="14" font-weight="600">AI svarer på norsk</text>
  <text x="268" y="182" fill="#EFEDE2" font-size="12.5">Kjenner salgsoppgaven</text>
  <text x="268" y="203" fill="#EFEDE2" font-size="12.5">Fellesgjeld og felleskostnader</text>
  <text x="268" y="224" fill="#EFEDE2" font-size="12.5">Byggeår og overtakelse</text>
  <text x="268" y="245" fill="#EFEDE2" font-size="12.5">Ledige visningstider</text>

  <line x1="438" y1="191" x2="470" y2="191" stroke="#15C07C" stroke-width="2" marker-end="url(#arw)"/>

  <!-- Step 3 -->
  <rect x="478" y="120" width="140" height="142" rx="12" fill="#12301F" stroke="#15C07C" stroke-opacity="0.35"/>
  <circle cx="502" cy="146" r="12" fill="#15A06A"/>
  <text x="502" y="151" fill="#0B2118" font-size="13" font-weight="700" text-anchor="middle">3</text>
  <text x="524" y="151" fill="#EFEDE2" font-size="14" font-weight="600">Kalender</text>
  <text x="498" y="182" fill="#3FE0A0" font-size="12.5" font-weight="600">Fellesvisning tirs 17:30</text>
  <text x="498" y="203" fill="#9FB3A7" font-size="12.5">Privatvisning sendes</text>
  <text x="498" y="221" fill="#9FB3A7" font-size="12.5">til megler for godkjenning</text>
  <text x="498" y="245" fill="#9FB3A7" font-size="12.5">Bud rutes alltid til megler</text>

  <line x1="624" y1="191" x2="656" y2="191" stroke="#15C07C" stroke-width="2" marker-end="url(#arw)"/>

  <!-- Step 4 -->
  <rect x="664" y="120" width="96" height="142" rx="12" fill="#15C07C"/>
  <text x="712" y="160" fill="#0B2118" font-size="13" font-weight="700" text-anchor="middle">Booket</text>
  <text x="712" y="178" fill="#0B2118" font-size="13" font-weight="700" text-anchor="middle">visning</text>
  <text x="712" y="206" fill="#0B2118" font-size="12" text-anchor="middle" opacity="0.8">SMS med en gang</text>
  <text x="712" y="224" fill="#0B2118" font-size="12" text-anchor="middle" opacity="0.8">Loggført i CRM</text>
  <text x="712" y="244" fill="#0B2118" font-size="12" text-anchor="middle" opacity="0.8">Megler varsles</text>

  <!-- Bottom stat band -->
  <rect x="40" y="292" width="720" height="92" rx="12" fill="#F3EFE4"/>
  <text x="60" y="318" fill="#16190F" font-size="12.5" font-weight="600" opacity="0.7">REGNEEKSEMPEL: MEGLERKONTOR MED TI AKTIVE OPPDRAG</text>

  <text x="60" y="356" fill="#15A06A" font-size="24" font-weight="700">~40</text>
  <text x="60" y="374" fill="#16190F" font-size="12" opacity="0.75">henvendelser i uka</text>

  <text x="250" y="356" fill="#15A06A" font-size="24" font-weight="700">1 av 3</text>
  <text x="250" y="374" fill="#16190F" font-size="12" opacity="0.75">kommer utenfor kontortid</text>

  <text x="470" y="356" fill="#15A06A" font-size="24" font-weight="700">8-12</text>
  <text x="470" y="374" fill="#16190F" font-size="12" opacity="0.75">anrop i uka blir aldri besvart</text>

  <line x1="230" y1="326" x2="230" y2="370" stroke="#E6E0D0" stroke-width="1.5"/>
  <line x1="450" y1="326" x2="450" y2="370" stroke="#E6E0D0" stroke-width="1.5"/>
</svg>
